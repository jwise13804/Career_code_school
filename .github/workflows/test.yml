# Runs the Playwright tests (desktop and phone) against the site served from a
# sub-path, like GitHub Pages. Uses the real Pyodide CDN.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/check-content.mjs
      - run: python3 tools/verify-labs.py
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"
          OFFLINE_PYODIDE: "0"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
