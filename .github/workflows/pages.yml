# Publishes the site to GitHub Pages on every push to main.
# There is no build step: we check the content, copy the published files
# into _site/ and upload them.
#
# One-time setup in the repo: Settings > Pages > Build and deployment >
# Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check lesson content
        run: node tools/check-content.mjs
      - name: Check every lab solution passes and every SQL answer runs
        run: python3 tools/verify-labs.py
      - name: Collect published files
        run: |
          mkdir _site
          cp -r index.html 404.html favicon.svg .nojekyll assets content _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
